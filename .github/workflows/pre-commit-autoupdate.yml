# Monthly pre-commit hook SHA rotation.
#
# Dependabot covers github-actions and pip but has no pre-commit ecosystem,
# so the 7 SHA-pinned hook repos in .pre-commit-config.yaml (and the adopter
# template harness/pre-commit-config.yaml) had no automated update path.
# This workflow runs `pre-commit autoupdate --freeze` on both files and opens
# a PR with the bumped pins.
#
# PRs created with GITHUB_TOKEN enter an approval-required CI state. Configure
# optional RELEASE_PR_TOKEN to let their checks start without manual approval.
#
# This workflow deliberately pushes with the job-scoped GITHUB_TOKEN, never
# the release deploy key: tag pushes made with GITHUB_TOKEN cannot trigger
# other workflows, so even a fully compromised run of this low-trust cron
# job has no path to release.yml or PyPI. The deploy key stays confined to
# the release workflows that need workflow-triggering pushes.

name: pre-commit-autoupdate

on:
  schedule:
    - cron: "0 6 1 * *" # first day of each month, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # job-scoped: push the chore branch; cannot trigger release.yml
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Autoupdate pinned hook SHAs
        id: update
        run: |
          set -euo pipefail
          uvx pre-commit==4.3.0 autoupdate --freeze --config .pre-commit-config.yaml
          uvx pre-commit==4.3.0 autoupdate --freeze --config harness/pre-commit-config.yaml
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Hook pins already current; nothing to update."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR when pins changed
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="chore/pre-commit-autoupdate-$(date -u +%Y-%m)"
          existing_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing_pr" ]]; then
            echo "PR #${existing_pr} already exists for ${branch}; nothing to update."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Push with the job-scoped token (checkout ran with
          # persist-credentials: false). GITHUB_TOKEN pushes cannot
          # trigger other workflows, so this job never needs the
          # release deploy key.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          git switch -c "$branch"
          git add .pre-commit-config.yaml harness/pre-commit-config.yaml
          git commit \
            -m "build: rotate pre-commit hook SHA pins (autoupdate --freeze)" \
            -m "Teach-back: review each frozen hook revision against its upstream release notes before merging."
          git push origin "HEAD:refs/heads/$branch"
          gh pr create \
            --title "build: rotate pre-commit hook SHA pins" \
            --body "Monthly \`pre-commit autoupdate --freeze\` over \`.pre-commit-config.yaml\` and \`harness/pre-commit-config.yaml\`. Review the diff against each hook repo's release notes before merging. With the default workflow token, approve the PR's queued checks; configure \`RELEASE_PR_TOKEN\` for unattended check startup." \
            --base main \
            --head "$branch"
